services:
  postgres:
    image: postgres:17-alpine
    container_name: cuentas-por-pagar-postgres
    environment:
      POSTGRES_DB: CuentasPorPagar
      POSTGRES_USER: cpp_local
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cpp_local -d CuentasPorPagar"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  postgres_data:
